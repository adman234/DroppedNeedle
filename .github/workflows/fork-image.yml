# Fork-only: builds a test image of this branch and pushes it to the fork's own GHCR
# namespace, so the work can be run on a real server before it is proposed upstream.
#
# This file lives ONLY on the fork-image/* branch, never on the feature branch that
# opens the pull request: upstream has its own release and dev-image workflows, and a
# contributor's personal build pipeline is not something to ask them to merge.
name: Fork test image

on:
  push:
    branches: ['fork-image/**']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: fork-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase the owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # amd64 only: this is for running on the owner's Unraid box, and dropping arm64
      # takes the build from "go and do something else" to a few minutes.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/droppedneedle:nzbget-test
            ghcr.io/${{ steps.owner.outputs.name }}/droppedneedle:nzbget-${{ steps.sha.outputs.short }}
          build-args: |
            COMMIT_TAG=nzbget-${{ steps.sha.outputs.short }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
